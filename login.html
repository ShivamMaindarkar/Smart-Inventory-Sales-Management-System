{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <div class="brand large"><span>SP</span> StockPilot</div>
    <h1>Inventory made simple.</h1>
    <p class="muted">Track stock, record sales and understand your business from one place.</p>
    <form method="post" class="form">
      <label>Email<input type="email" name="email" required autocomplete="email"></label>
      <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
      <button class="btn primary full">Sign in</button>
    </form>
    <p class="switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
